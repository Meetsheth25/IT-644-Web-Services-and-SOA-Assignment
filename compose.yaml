services:
  # ============================================================================
  # LAB 7: API GATEWAY (Single Public Entry Point)
  # ============================================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:3001}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL:-http://product-service:3002}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://order-service:3003}
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - campus-network

  # ============================================================================
  # BACKEND MICROSERVICES (Internal Network Only - Isolated from External Host)
  # ============================================================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    # Ports not mapped to host to enforce API Gateway as single entry point (Lab 7)
    expose:
      - "3001"
    environment:
      - PORT=3001
      - USER_SERVICE_PORT=${USER_SERVICE_PORT:-3001}
      - MONGODB_URI=${USER_MONGODB_URI:-mongodb://mongodb:27017/user_db}
    depends_on:
      - mongodb
    networks:
      - campus-network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    # Ports not mapped to host to enforce API Gateway as single entry point (Lab 7)
    expose:
      - "3002"
    environment:
      - PORT=3002
      - PRODUCT_SERVICE_PORT=${PRODUCT_SERVICE_PORT:-3002}
      - MONGODB_URI=${PRODUCT_MONGODB_URI:-mongodb://mongodb:27017/product_db}
    depends_on:
      - mongodb
    networks:
      - campus-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    # Ports not mapped to host to enforce API Gateway as single entry point (Lab 7)
    expose:
      - "3003"
    environment:
      - PORT=3003
      - ORDER_SERVICE_PORT=${ORDER_SERVICE_PORT:-3003}
      - MONGODB_URI=${ORDER_MONGODB_URI:-mongodb://mongodb:27017/order_db}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:3001}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL:-http://product-service:3002}
    depends_on:
      - mongodb
      - user-service
      - product-service
    networks:
      - campus-network

  # ============================================================================
  # PERSISTENT STORAGE
  # ============================================================================
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    # Internal port exposure only - MongoDB isolated from external host (Lab 7)
    expose:
      - "27017"
    volumes:
      - campus-mongo-data:/data/db
    networks:
      - campus-network

volumes:
  campus-mongo-data:
    name: campus-mongo-data

networks:
  campus-network:
    name: campus-network
