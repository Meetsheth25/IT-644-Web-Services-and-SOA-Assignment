apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: lab8
  labels:
    app: ai-service
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: campusconnect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/part-of: campusconnect
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/meetsheth25/ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: PORT_AI
            - name: AI_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: AI_PROVIDER
            - name: AI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: AI_MODEL
            - name: AI_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: AI_TIMEOUT_MS
            - name: MAX_INPUT_LENGTH
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: MAX_INPUT_LENGTH
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: CORS_ORIGIN
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: campusconnect-secrets
                  key: AI_API_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

