  <!-- Background -->
  <rect width="1920" height="1080" fill="#0B1120" />

  <!-- Header -->
  <rect width="1920" height="90" fill="#1E293B" />
  <text x="50" y="42" class="title">CampusConnect Microservices — End-to-End Architecture</text>
  <text x="52" y="72" class="subtitle">IT 644 Web Services &amp; SOA • Lab 8 Final Specification • Kubernetes Orchestration, GHCR CI/CD &amp; Prometheus/Grafana Monitoring</text>

  <!-- Zone 1: Kubernetes Cluster -->
  <rect x="40" y="120" width="1280" height="630" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="56" y="148" class="zone-title">KUBERNETES CLUSTER (Namespace: lab8 • Docker Desktop Control-Plane Ready v1.36.1)</text>

  <!-- Client Card -->
  <g transform="translate(60, 170)">
    <rect width="230" height="115" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <rect x="135" y="12" width="80" height="20" rx="3" fill="#475569" />
    <text x="175" y="26" class="badge-text">CLIENT</text>
    <text x="14" y="28" class="card-title">Client / Postman</text>
    <text x="14" y="48" class="card-sub">External Traffic Entry</text>
    <text x="14" y="68" class="card-body">• HTTP REST Calls</text>
    <text x="14" y="86" class="card-body">• Target: NodePort 30080</text>
    <text x="14" y="104" class="card-body">• Port-Forward / LB 3000</text>
  </g>

  <!-- Gateway Service Card -->
  <g transform="translate(330, 170)">
    <rect width="270" height="115" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="1.5" />
    <rect x="175" y="12" width="80" height="20" rx="3" fill="#0369A1" />
