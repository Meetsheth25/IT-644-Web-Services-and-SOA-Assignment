apiVersion: v1
kind: Secret
metadata:
  name: campusconnect-secrets
  namespace: lab8
  labels:
    app.kubernetes.io/part-of: campusconnect
type: Opaque
stringData:
  # NOTE: Replace with your actual MongoDB Atlas connection strings or create secret via CLI:
  # kubectl create secret generic campusconnect-secrets -n lab8 \
  #   --from-literal=USER_MONGODB_URI="mongodb+srv://<USER>:<PASS>@<CLUSTER>.mongodb.net/user_db" \
  #   --from-literal=PRODUCT_MONGODB_URI="mongodb+srv://<USER>:<PASS>@<CLUSTER>.mongodb.net/product_db" \
  #   --from-literal=ORDER_MONGODB_URI="mongodb+srv://<USER>:<PASS>@<CLUSTER>.mongodb.net/order_db"
  USER_MONGODB_URI: "mongodb://mongodb:27017/user_db"
  PRODUCT_MONGODB_URI: "mongodb://mongodb:27017/product_db"
  ORDER_MONGODB_URI: "mongodb://mongodb:27017/order_db"
