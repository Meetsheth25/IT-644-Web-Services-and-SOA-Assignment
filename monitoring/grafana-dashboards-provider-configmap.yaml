apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provisioning
  namespace: lab8
  labels:
    app: grafana
    app.kubernetes.io/part-of: campusconnect-monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'campusconnect-dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        editable: true
        options:
          path: /var/lib/grafana/dashboards
