apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab8
  labels:
    app: prometheus
    app.kubernetes.io/part-of: campusconnect-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: 'api-gateway'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['gateway-service.lab8.svc.cluster.local:3000', 'gateway-service:3000']
            labels:
              service: 'api-gateway'

      - job_name: 'user-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['user-service.lab8.svc.cluster.local:3001', 'user-service:3001']
            labels:
              service: 'user-service'

      - job_name: 'product-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['product-service.lab8.svc.cluster.local:3002', 'product-service:3002']
            labels:
              service: 'product-service'

      - job_name: 'order-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['order-service.lab8.svc.cluster.local:3003', 'order-service:3003']
            labels:
              service: 'order-service'
