apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: lab8
  labels:
    app: prometheus
    app.kubernetes.io/part-of: campusconnect-monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: web
      protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30090
