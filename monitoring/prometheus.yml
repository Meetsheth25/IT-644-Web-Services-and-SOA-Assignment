global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000', 'api-gateway:3000']
        labels:
          service: 'api-gateway'

  - job_name: 'user-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3001', 'user-service:3001']
        labels:
          service: 'user-service'

  - job_name: 'product-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3002', 'product-service:3002']
        labels:
          service: 'product-service'

  - job_name: 'order-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3003', 'order-service:3003']
        labels:
          service: 'order-service'
